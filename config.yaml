# Backtest defaults. Command-line flags override the dates; strategy settings
# change here.

periods:
  # Backtests start on `start`; prices from before it only warm up indicators.
  # Results are reported for the whole run, before `split` (the period
  # settings may be tuned on) and from `split` on (never tuned on).
  stocks: {start: 2015-01-01, split: 2022-01-01}
  # 2021, not 2019: before 2021 fewer than 100 Binance USDT pairs traded most
  # days, so a "top 200" backtest would really trade 19-80 coins.
  crypto: {start: 2021-01-01, split: 2024-01-01}

initial_cash:
  us_equity: 100000       # USD
  india_equity: 1000000   # INR
  crypto: 100000          # USDT

engine:
  # Resize a held position only once its weight drifts more than 25% from
  # target, so a weekly rebalance doesn't trade on every small price move.
  rebalance_tolerance: 0.25
  # The crypto engine models perpetual futures and charges funding every 8 h
  # unless told otherwise. These are spot trades, so no funding.
  crypto_funding_rate: 0.0
  # Market-trend filter (strategies' regime_filter): the universe's index, or
  # BTC for crypto, must close above this many days' average.
  regime_ma: 200
  # Cost per side the fast sweep evaluator charges (the engine models the full
  # fee stack). US: 0.05% slippage. India: STT 0.1% + 0.1% slippage + exchange,
  # stamp, SEBI and GST ~0.02%. Crypto: 0.05% taker + 0.05% slippage.
  sweep_cost_per_side: {us_equity: 0.0005, india_equity: 0.0022, crypto: 0.001}

# Settings `python -m vibetrading sweep` tries, on the in-sample years only.
# Every combination is evaluated; the one with the best in-sample Sharpe is
# written to tuned.yaml. Out-of-sample results are reported, never used to choose.
sweeps:
  momentum:
    lookback: [63, 126, 252]
    top_n: [5, 10, 20]
    rebalance: [weekly, monthly]
    regime_filter: [false, true]
    liquid_top: [null, 50]
  pullback:
    entry_rsi: [5, 10, 20]
    exit_rule: [rsi, ma]
    max_hold_bars: [5, 10, 20]
    stop_loss: [0.08, null]
    regime_filter: [false, true]
    liquid_top: [null, 50]

strategies:
  momentum:
    lookback: 126        # bars of return to rank by (~6 months of stock trading)
    trend_ma: 200        # only symbols closing above this moving average
    top_n: 10
    rebalance: weekly    # or monthly
  pullback:
    trend_ma: 200
    rsi_period: 2
    entry_rsi: 10
    exit_rsi: 70
    max_hold_bars: 10
    stop_loss: 0.08
    max_positions: 10
    rank_lookback: 126
